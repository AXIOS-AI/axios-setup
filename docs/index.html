<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXIOS-AI - Demo Video</title>
    <style>
        body { background: #1a1a2e; color: #eee; font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        h1 { color: #00d4ff; text-align: center; }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 20px; max-width: 1200px; margin: 30px auto; }
        .video-card { background: #16213e; border-radius: 10px; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .video-card h3 { color: #00d4ff; margin: 0 0 10px 0; font-size: 1.1em; }
        video { width: 100%; border-radius: 6px; }
        .footer { text-align: center; color: #555; margin-top: 40px; font-size: 0.9em; }
    </style>
</head>
<body>
    <h1>🎬 AXIOS-AI - Demo Video</h1>
    <div class="video-grid">
        <div class="video-card">
            <h3>AXIOS vs Winfarm</h3>
            <video controls preload="none">
                <source src="axios-demo-prodotti-campagna.mp4" type="video/mp4">
            </video>
        </div>
        <!-- AGGIUNGI NUOVI VIDEO QUI -->
    </div>
    <div class="footer">AXIOS-AI © 2026</div>
</body>
</html>
