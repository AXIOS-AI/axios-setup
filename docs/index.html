<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXIOS-AI - Demo Video</title>
    <style>
        body { background: #1a1a2e; color: #eee; font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        h1 { color: #00d4ff; text-align: center; font-size: 2em; }
        .video-grid { display: flex; flex-direction: column; align-items: center; gap: 30px; max-width: 1100px; margin: 30px auto; }
        .video-card { background: #16213e; border-radius: 10px; padding: 20px; box-shadow: 0 4px 25px rgba(0,212,255,0.15); width: 100%; max-width: 1000px; }
        .video-card h3 { color: #00d4ff; margin: 0 0 12px 0; font-size: 1.3em; text-align: center; }
        video { width: 100%; border-radius: 6px; display: block; }
        .footer { text-align: center; color: #555; margin-top: 40px; font-size: 0.9em; }
        @media (max-width: 1050px) { .video-card { max-width: 95vw; } }
    </style>
</head>
<body>
    <h1>🎬 AXIOS-AI - Demo Video</h1>
    <div class="video-grid">
        <div class="video-card">
            <h3>AXIOS vs Winfarm</h3>
            <video controls preload="none" poster="video-cover.jpg">
                <source src="axios-demo-prodotti-campagna.mp4" type="video/mp4">
            </video>
        </div>
        <div class="video-card">
            <h3>Installare AXIOS</h3>
            <video controls preload="none" poster="installare-axios-poster.png">
                <source src="installare-axios.mp4" type="video/mp4">
            </video>
        </div>
        <div class="video-card">
            <h3>Come nasce Axios</h3>
            <video controls preload="none" poster="come-nasce-axios-poster.jpg">
                <source src="come-nasce-axios.mp4" type="video/mp4">
            </video>
        </div>
        <!-- AGGIUNGI NUOVI VIDEO QUI -->
    </div>
    <div class="footer">AXIOS-AI © 2026</div>
</body>
</html>
